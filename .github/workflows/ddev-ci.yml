name: DDEV QA

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ddev-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup DDEV
        uses: ddev/github-action-setup-ddev@v1

      - name: Prepare Laravel environment
        run: |
          ddev exec cp .env.example .env
          ddev exec mkdir -p database
          ddev exec touch database/database.sqlite

      - name: Install dependencies
        run: |
          ddev composer install --no-interaction --prefer-dist
          ddev npm ci

      - name: Initialize application
        run: ddev artisan key:generate

      - name: Build frontend
        run: |
          ddev npm run build
          ddev npm run build:demo

      - name: Verify Laravel application
        run: |
          ddev artisan migrate --force
          ddev artisan route:list --except-vendor
          ddev artisan view:cache

      - name: Run tests
        run: ddev artisan test
